<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Chatbot by Gemini AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <h1><i class="fas fa-briefcase"></i> Career Chatbot</h1>
      <p>Your AI Career Advisor</p>
    </div>

    <!-- Chat Messages Area -->
    <div id="chat-box" class="chat-box"></div>

    <!-- Chat Input Area -->
    <div class="chat-input-area">
      <form id="chat-form">
        <div class="input-container">
          <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Ask me about your CV, projects, or career growth..." autocomplete="off" />
            
            <!-- File Upload Icons -->
            <div class="upload-icons">
              <label for="image-upload" title="Upload Image">
                <i class="fas fa-image"></i>
                <input type="file" id="image-upload" accept="image/*" hidden />
              </label>
              
              <label for="file-upload" title="Upload Document">
                <i class="fas fa-file"></i>
                <input type="file" id="file-upload" accept=".pdf,.doc,.docx,.txt,.xlsx,.xls" hidden />
              </label>
              
              <label for="audio-upload" title="Upload Audio">
                <i class="fas fa-microphone"></i>
                <input type="file" id="audio-upload" accept="audio/*" hidden />
              </label>
            </div>
          </div>
          
          <button type="submit" class="send-button" title="Send message">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        
        <!-- Selected file indicator -->
        <div id="file-indicator" class="file-indicator"></div>

      </form>

      <!-- Footer Info -->
      <div class="chat-footer">
        <p>Upload your CV, portfolio, or projects for professional feedback and career guidance</p>
      </div>
    </div>
    <!-- Image Modal -->
    <div id="image-modal" class="image-modal">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <img id="modal-image" src="" alt="Expanded view" class="modal-image" />
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
