<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chatbot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Gemini AI Chatbot</h1>
    <div id="chat-box" class="chat-box"></div>
    
    <form id="chat-form">
      <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
        
        <!-- File Upload Icons -->
        <div class="upload-icons">
          <label for="image-upload" title="Upload Image">
            <i class="fas fa-image"></i>
            <input type="file" id="image-upload" accept="image/*" hidden />
          </label>
          
          <label for="file-upload" title="Upload Document">
            <i class="fas fa-file"></i>
            <input type="file" id="file-upload" accept=".pdf,.doc,.docx,.txt,.xlsx,.xls" hidden />
          </label>
          
          <label for="audio-upload" title="Upload Audio">
            <i class="fas fa-microphone"></i>
            <input type="file" id="audio-upload" accept="audio/*" hidden />
          </label>
        </div>
      </div>
      
      <button type="submit">Send</button>
    </form>
    
    <!-- Selected file indicator -->
    <div id="file-indicator" class="file-indicator"></div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
